<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#b51232">
  <title>مصطفى تيوب | منصة مدرسي العراق</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
*{box-sizing:border-box} :root{--red:#e5092f;--red2:#690018;--ink:#09090c;--muted:#b9aeb2;--line:#f0bd32;--gold:#ffd34e;--bg:#09090c;--soft:#171116}body{margin:0;background:radial-gradient(ellipse at 50% -20%,#4a0718 0%,#16070d 38%,#08080b 78%);color:#fff;font-family:"IBM Plex Sans Arabic",sans-serif}button,input{font:inherit}.topbar{height:82px;padding:12px clamp(16px,4vw,56px);display:flex;align-items:center;gap:22px;border-bottom:1px solid #ffd34e55;position:sticky;top:0;background:#09090ceF;backdrop-filter:blur(14px);z-index:5;box-shadow:0 5px 25px #e5092f18}.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:#fff;font-size:22px;font-weight:700;white-space:nowrap}.brand b{color:var(--gold)}.brand small{display:block;font:600 9px Arial;letter-spacing:2px;color:#999}.play{width:38px;height:27px;border-radius:9px;background:linear-gradient(135deg,#ff244c,#92001f);color:white;box-shadow:0 0 16px #ff174966;display:grid;place-items:center;font-size:14px}.icon-btn{border:0;background:transparent;font-size:24px;cursor:pointer}.search{height:44px;max-width:600px;flex:1;margin-inline:auto;background:#171116;border:1px solid #ffd34e88;border-radius:30px;box-shadow:0 0 13px #ffd34e22;display:flex;align-items:center;padding:0 16px;gap:10px;color:#777}.search span{font-size:27px}.search input{border:0;outline:0;background:transparent;width:100%;color:var(--ink)}.search-mobile{display:none}.chips{display:flex;gap:10px;overflow:auto;padding:17px clamp(16px,4vw,56px);scrollbar-width:none}.chip{border:1px solid #ffd34e77;border-radius:12px;background:#171116;color:#fff;padding:9px 20px;white-space:nowrap;cursor:pointer;font-weight:600;box-shadow:0 0 9px #ffd34e20;transition:.2s}.chip.active{background:linear-gradient(120deg,#ed123b,#76001c);color:white;border-color:var(--gold);box-shadow:0 0 17px #ffd34e66,0 0 22px #e5092f55}main{max-width:1500px;margin:auto;padding:12px clamp(16px,4vw,56px) 70px}.section{margin:28px 0 46px}.section-head{display:flex;justify-content:space-between;align-items:end;margin-bottom:20px}.section-head h2{margin:3px 0 0;font-size:25px}.eyebrow{font-size:12px;color:var(--gold);font-weight:700;text-shadow:0 0 10px #ffd34e55}.muted{color:var(--muted);font-size:13px}.text-btn{border:1px solid #ffd34e88;background:#1b1015;color:var(--gold);font-weight:700;cursor:pointer;border-radius:10px;padding:8px 13px;box-shadow:0 0 12px #ffd34e22}.teachers{display:flex;gap:26px;overflow:auto;padding:5px 2px 15px;scrollbar-width:thin}.teacher{min-width:112px;max-width:125px;text-align:center;border:1px solid #ffd34e55;background:linear-gradient(160deg,#211018,#100b0f);border-radius:17px;padding:12px 8px;cursor:pointer;color:inherit;box-shadow:0 0 12px #ffd34e20;transition:.2s}.teacher:hover{border-color:var(--gold);box-shadow:0 0 18px #ffd34e77,0 0 25px #e5092f44;transform:translateY(-3px)}.avatar{width:88px;height:88px;border-radius:50%;object-fit:cover;border:2px solid var(--gold);padding:3px;background:#170b10;box-shadow:0 0 10px #ffd34e88,0 0 22px #e5092f55;display:block;margin:0 auto 9px}.avatar-fallback{display:grid;place-items:center;background:#28101a;color:var(--gold);font-size:30px;font-weight:700}.teacher-name{font-weight:600;font-size:14px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.teacher-sub{font-size:11px;color:var(--gold)}.video-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:26px 20px}.video-card{min-width:0;cursor:pointer;padding:8px;border-radius:19px;background:linear-gradient(145deg,#1b1016,#0b0a0d);border:1px solid #ffd34e66;box-shadow:0 0 12px #ffd34e22;transition:.2s}.video-card:hover{box-shadow:0 0 19px #ffd34e88,0 0 28px #e5092f55;transform:translateY(-2px)}.thumb-wrap{position:relative;aspect-ratio:16/9;border-radius:16px;overflow:hidden;background:#160b10;border:1px solid var(--gold);box-shadow:0 0 10px #ffd34e88,0 0 22px #e5092f44}.thumb{width:100%;height:100%;object-fit:cover;display:block;transition:transform .25s}.video-card:hover .thumb{transform:scale(1.035)}.duration{position:absolute;bottom:9px;left:9px;background:#111d;color:white;border-radius:6px;padding:3px 7px;font:600 11px Arial}.video-info{display:flex;gap:11px;padding:11px 4px 3px}.mini-avatar{width:37px;height:37px;border-radius:50%;object-fit:cover;background:#211018;border:1px solid var(--gold);flex:none}.video-title{font-size:15px;font-weight:600;line-height:1.65;margin:0 0 4px;color:#fff;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.video-channel,.video-date{font-size:12px;color:var(--muted);margin:2px 0}.loading,.empty{padding:32px;color:var(--gold);text-align:center;grid-column:1/-1;background:#171116;border:1px solid #ffd34e77;box-shadow:0 0 15px #ffd34e33;border-radius:14px}.modal{display:none;position:fixed;inset:0;z-index:20;align-items:center;justify-content:center;padding:18px}.modal.open{display:flex}.modal-backdrop{position:absolute;inset:0;background:#08080bcc}.modal-box{position:relative;background:#100b0f;color:#fff;border:1px solid var(--gold);box-shadow:0 0 25px #ffd34e66,0 0 40px #e5092f44;border-radius:18px;padding:18px;width:min(850px,100%);z-index:1}.close{position:absolute;top:8px;left:12px;border:0;background:#211018;color:var(--gold);font-size:28px;cursor:pointer;z-index:2}.player{aspect-ratio:16/9;background:#111;border-radius:12px;overflow:hidden;margin-bottom:15px}.player iframe{width:100%;height:100%;border:0}.outline-btn{display:inline-block;border:1px solid var(--gold);padding:8px 14px;border-radius:9px;text-decoration:none;color:var(--gold);font-weight:600;box-shadow:0 0 12px #ffd34e33}.toast{position:fixed;bottom:20px;left:50%;transform:translate(-50%,20px);background:#222;color:white;padding:10px 18px;border-radius:10px;opacity:0;transition:.2s;z-index:30}.toast.show{opacity:1;transform:translate(-50%,0)}footer{border-top:1px solid #ffd34e66;padding:25px clamp(16px,4vw,56px);display:flex;justify-content:space-between;gap:15px;color:var(--muted);font-size:12px;background:#09090c}.small-brand{font-size:15px}.small-brand .play{width:27px;height:20px;font-size:10px}@media(max-width:900px){.video-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.topbar{gap:12px}.brand{font-size:19px}}@media(max-width:600px){.topbar{height:70px;padding:10px 14px;gap:12px}.topbar>.icon-btn:first-child{display:none}.brand{font-size:18px}.play{width:33px;height:24px}.search{height:39px}.search-mobile{display:none}.chips{padding:12px 14px;gap:8px}.chip{padding:8px 15px;font-size:13px}main{padding:4px 14px 45px}.section{margin:22px 0 34px}.section-head h2{font-size:21px}.teachers{gap:17px}.teacher{min-width:91px}.avatar{width:75px;height:75px}.video-grid{grid-template-columns:1fr;gap:22px}.thumb-wrap{border-radius:13px}.video-title{font-size:14px}footer{flex-direction:column}.modal-box{padding:12px}.modal{padding:10px}}
</style>
</head>
<body>
<header class="topbar">
  <button class="icon-btn" id="menuBtn" aria-label="القائمة">☰</button>
  <a class="brand" href="/"><span class="play">▶</span><span>مصطفى <b>تيوب</b><small>MUSTAFA TUBE</small></span></a>
  <label class="search"><span>⌕</span><input id="searchInput" placeholder="ابحث عن مدرس أو محاضرة..." autocomplete="off"></label>
  <button class="icon-btn search-mobile" id="mobileSearch" aria-label="بحث">⌕</button>
</header>
<nav class="chips" id="subjects">
  <button class="chip active" data-subject="الكل">الكل</button>
  <button class="chip" data-subject="الإسلامية">الإسلامية</button>
  <button class="chip" data-subject="اللغة العربية">اللغة العربية</button>
  <button class="chip" data-subject="الإنكليزية">الإنكليزية</button>
  <button class="chip" data-subject="الرياضيات">الرياضيات</button>
  <button class="chip" data-subject="الفيزياء">الفيزياء</button>
  <button class="chip" data-subject="الكيمياء">الكيمياء</button>
  <button class="chip" data-subject="الأحياء">الأحياء</button>
</nav>
<main>
  <section class="section">
    <div class="section-head"><div><span class="eyebrow">تعلّم من أفضل المدرسين</span><h2>مدرسو العراق</h2></div><span class="muted" id="teacherCount">جارِ التحميل...</span></div>
    <div class="teachers" id="teachers"><div class="loading">جارِ تحميل القنوات...</div></div>
  </section>
  <section class="section">
    <div class="section-head"><div><span class="eyebrow">كل جديد بمكان واحد</span><h2 id="feedTitle">أحدث المحاضرات</h2></div><button class="text-btn" id="homeBtn">عرض الكل</button></div>
    <div class="video-grid" id="videos"><div class="loading">جارِ تحميل المحاضرات...</div></div>
  </section>
</main>
<footer><span class="brand small-brand"><span class="play">▶</span> مصطفى تيوب</span><span>منصة تعليمية تجمع قنوات مدرسي العراق</span></footer>
<div class="modal" id="videoModal" aria-hidden="true">
  <div class="modal-backdrop" data-close></div><div class="modal-box">
    <button class="close" data-close aria-label="إغلاق">×</button>
    <div class="player" id="player"></div><h3 id="modalTitle"></h3><p id="modalMeta" class="muted"></p>
    <a id="youtubeLink" class="outline-btn" target="_blank" rel="noopener">فتح على يوتيوب ↗</a>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
const $ = s => document.querySelector(s);
let channels = [], allVideos = [], activeSubject = "الكل", activeChannel = null;
const fmtDate = value => value ? new Intl.DateTimeFormat("ar-IQ",{dateStyle:"medium"}).format(new Date(value)) : "";
const fmtDuration = iso => {
  if (!iso) return "";
  const m = iso.match(/PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/);
  if (!m) return "";
  const h=+(m[1]||0), min=+(m[2]||0), sec=+(m[3]||0);
  return h ? `${h}:${String(min).padStart(2,"0")}:${String(sec).padStart(2,"0")}` : `${min}:${String(sec).padStart(2,"0")}`;
};
function toast(message){const el=$("#toast");el.textContent=message;el.classList.add("show");setTimeout(()=>el.classList.remove("show"),2800)}
function esc(s=""){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
async function api(url){const r=await fetch(url);const data=await r.json();if(!r.ok)throw new Error(data.error||"تعذر تحميل البيانات");return data}
function renderTeachers(){
 const list=channels.filter(c=>activeSubject==="الكل"||c.subject===activeSubject||c.subject==="عام");
 $("#teacherCount").textContent=`${list.length} قناة`;
 $("#teachers").innerHTML=list.length?list.map(c=>`<button class="teacher" data-channel="${esc(c.id)}">
 ${c.avatar?`<img class="avatar" src="${esc(c.avatar)}" alt="">`:`<span class="avatar avatar-fallback">${esc((c.name||"م").slice(0,1))}</span>`}
 <span class="teacher-name">${esc(c.name)}</span><span class="teacher-sub">${esc(c.subject||"مدرس")}</span></button>`).join(""):`<div class="empty">لا توجد قنوات بهذا القسم حالياً</div>`;
 document.querySelectorAll("[data-channel]").forEach(b=>b.addEventListener("click",()=>loadChannel(b.dataset.channel)));
}
function renderVideos(list){
 $("#videos").innerHTML=list.length?list.map(v=>`<article class="video-card" data-video="${esc(v.id)}">
 <div class="thumb-wrap"><img class="thumb" loading="lazy" src="${esc(v.thumbnail)}" alt=""><span class="duration">${fmtDuration(v.duration)}</span></div>
 <div class="video-info">${v.channel?.avatar?`<img class="mini-avatar" src="${esc(v.channel.avatar)}" alt="">`:""}
 <div><h3 class="video-title">${esc(v.title)}</h3><p class="video-channel">${esc(v.channel?.name||"")}</p><p class="video-date">${fmtDate(v.publishedAt)}</p></div></div></article>`).join(""):`<div class="empty">لا توجد محاضرات للعرض حالياً</div>`;
 document.querySelectorAll("[data-video]").forEach(card=>card.addEventListener("click",()=>openVideo(allVideos.find(v=>v.id===card.dataset.video))));
}
function openVideo(v){
 if(!v)return;
 $("#player").innerHTML=`<iframe src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(v.id)}?autoplay=1&rel=0" title="${esc(v.title)}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>`;
 $("#modalTitle").textContent=v.title;$("#modalMeta").textContent=`${v.channel?.name||""} · ${fmtDate(v.publishedAt)}`;
 $("#youtubeLink").href=v.url;$("#videoModal").classList.add("open");$("#videoModal").setAttribute("aria-hidden","false");
}
function closeModal(){$("#player").innerHTML="";$("#videoModal").classList.remove("open");$("#videoModal").setAttribute("aria-hidden","true")}
async function loadChannel(id){
 const ch=channels.find(c=>c.id===id);if(!ch)return;
 activeChannel=ch;$("#feedTitle").textContent=`محاضرات ${ch.name}`;$("#videos").innerHTML='<div class="loading">جارِ تحميل محاضرات القناة...</div>';
 try{const data=await api(`/api/channels/${encodeURIComponent(id)}/videos`);allVideos=data.videos.map(v=>({...v,channel:ch}));renderVideos(allVideos);$("#homeBtn").textContent="العودة للرئيسية"}
 catch(e){$("#videos").innerHTML=`<div class="empty">${esc(e.message)}</div>`}
}
async function init(){
 try{
  const data=await api("/api/channels");channels=data.channels||[];renderTeachers();
  const good=channels.filter(c=>c.id&&!c.id.startsWith("pending-"));
  if(!good.length){$("#videos").innerHTML='<div class="empty">تم تجهيز الواجهة. أضف مفتاح YouTube API للسيرفر حتى تظهر المحاضرات الحقيقية.</div>';return}
  const results=await Promise.allSettled(good.map(async c=>{const d=await api(`/api/channels/${encodeURIComponent(c.id)}/videos`);return d.videos.map(v=>({...v,channel:c}))}));
  allVideos=results.filter(r=>r.status==="fulfilled").flatMap(r=>r.value).sort((a,b)=>new Date(b.publishedAt)-new Date(a.publishedAt));
  renderVideos(allVideos);
  if(!allVideos.length)$("#videos").innerHTML='<div class="empty">لم تظهر فيديوهات بعد. تحقق من إعداد مفتاح API.</div>';
 }catch(e){$("#teachers").innerHTML=`<div class="empty">${esc(e.message)}</div>`;$("#videos").innerHTML='<div class="empty">تعذر الاتصال بالسيرفر.</div>'}
}
$("#subjects").addEventListener("click",e=>{const b=e.target.closest("[data-subject]");if(!b)return;activeSubject=b.dataset.subject;document.querySelectorAll(".chip").forEach(x=>x.classList.toggle("active",x===b));renderTeachers();});
$("#searchInput").addEventListener("input",e=>{const q=e.target.value.trim().toLowerCase();renderVideos(allVideos.filter(v=>`${v.title} ${v.channel?.name||""}`.toLowerCase().includes(q)))});
$("#homeBtn").addEventListener("click",()=>{activeChannel=null;$("#feedTitle").textContent="أحدث المحاضرات";$("#homeBtn").textContent="عرض الكل";renderVideos(allVideos)});
document.querySelectorAll("[data-close]").forEach(x=>x.addEventListener("click",closeModal));
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal()});
init();
</script>
<script>
if (location.protocol === "file:") {
  const note = document.createElement("div");
  note.className = "empty";
  note.style.margin = "0 14px 24px";
  note.textContent = "هذه معاينة الواجهة. لجلب قنوات يوتيوب الحقيقية وتشغيل التحديث التلقائي، افتحها من رابط السيرفر بعد نشر المشروع.";
  document.body.appendChild(note);
}
</script>
</body></html>
